name: Seth
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.example.seth
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Seth reads your schedule only when you ask and have turned this on."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Seth listens only while the mic button is active."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Seth turns your speech into text, on your iPhone when possible."
targets:
  Seth:
    type: application
    platform: iOS
    sources: [Sources]
